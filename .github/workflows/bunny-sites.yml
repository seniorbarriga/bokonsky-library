name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys serialize across every ref; cancelling mid-upload would leave a half-written deploy directory behind.
concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # records the deploy in the repo's Environments
    steps:
      - uses: actions/checkout@v7
      - name: Debug Bunny Sites List
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: npx --yes @bunny.net/cli@0.15 whoami
      # No build step: static files deploy as-is.
      - uses: BunnyWay/actions/deploy-site@deploy-site_0.1.0
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        with:
          site: bokonsky-library
          directory: .
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
